  --ink:#141116; --card:#1f1b23; --card2:#2a2530; --line:rgba(255,255,255,.12);
  --text:#f7eff2; --muted:#bdb2bb;
  --blush:#fbe8ec; --blush-ink:#2b1a24; --blush-muted:#6f5360;
  --work:#ffe047; --play:#ff4fa3; --zen:#8adfe2;--zen2:#b39bf5;
  --accent:#ff4fa3; --accent-ink:#2a0516;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Yellowtail","Snell Roundhand",cursive;
  color-scheme:dark;
}
body[data-view="home"]{--accent:#ff4fa3;--accent-ink:#2a0516}
body[data-view="work"]{--accent:#ffe047;--accent-ink:#2a1d00}
body[data-view="play"]{--accent:#ff4fa3;--accent-ink:#2a0516}
body[data-view="zen"]{--accent:#2a9fa8;--accent-ink:#06262b;--ink:#e2f3f5;--card:#f8fdfd;--card2:#e0f1f4;--line:rgba(42,159,168,.28);--text:#12363b;--muted:#4b7479;--blush:#f1fbfc;--blush-ink:#12363b;--blush-muted:#4b7479;color-scheme:light}
body[data-view="journey"],body[data-view="healthcode"]{--accent:#ffb3c7;--accent-ink:#2a0516}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;transition:background .5s}
body[data-view="zen"]{background:linear-gradient(180deg,#cdecef 0%,#e2f4f6 50%,#f2fafb 100%) fixed;color:var(--text)}
#app{max-width:560px;margin:0 auto;padding-top:18px;padding-bottom:128px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.disp{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.script{font-family:var(--script);color:var(--accent);font-size:28px;line-height:1.1}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.hero{border-radius:28px;overflow:hidden;position:relative;aspect-ratio:960/677;background:var(--logo) center/cover;border:1px solid var(--line)}
.sechead{display:flex;gap:14px;align-items:center}
.thumb{width:92px;flex:none;aspect-ratio:960/677;border-radius:16px;background:var(--logo) center/cover;border:1px solid var(--line)}
.sechead h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:40px;line-height:.95}
.sechead p{color:var(--muted);font-size:14px}
.greet{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.greet h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:44px;line-height:.95;overflow-wrap:anywhere;text-wrap:balance}
.namebtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;align-self:flex-start}
.welcome{background:var(--blush);color:var(--blush-ink);border-radius:20px;padding:14px 16px;font-weight:500}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.blush{background:var(--blush);color:var(--blush-ink);border-color:transparent}
.card.blush .muted{color:var(--blush-muted)}
.card h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:28px;line-height:1}
.card h3{font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.blush .hint{color:var(--blush-muted)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:700;min-height:46px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.9}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.pill{max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* check-in choices */
.choices{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--c);border-radius:22px;padding:16px 18px;transition:transform .15s,box-shadow .2s}
.def{background:rgba(255,255,255,.55);border-left:3px solid var(--c);border-radius:12px;padding:10px 14px;display:grid;gap:4px;font-size:15px}
.def b{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:18px;color:var(--blush-ink)}
.def p{margin:0}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dtags span{background:var(--blush-ink);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.03em}
.choice.sel{background:linear-gradient(0deg,rgba(255,255,255,.05),rgba(255,255,255,.05)),var(--card);box-shadow:0 0 22px -6px var(--c),inset 0 0 0 1.5px var(--c)}
.choice:hover{box-shadow:0 0 22px -6px var(--c);transform:translateY(-1px)}
.choice .em{font-size:30px;flex:none}
.choice .nm{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;color:var(--c);line-height:1}
.choice .ds{font-size:15px;color:var(--text)}
.response{border-radius:26px;padding:22px;background:var(--blush);color:var(--blush-ink);display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--c)}
.response .msg{font-size:21px;line-height:1.3;font-weight:500}
.response .act{background:#fff;border-radius:16px;padding:12px 14px}
.response .hint{color:var(--blush-ink);opacity:.75}
.response .act b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blush-muted)}
.response .btn{background:var(--blush-ink);color:#fff}
.response .btn.ghost{background:transparent;color:var(--blush-ink)}
.pill{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;padding:2px 12px;border-radius:999px;background:var(--c);color:#1a1200;width:max-content}

/* pillar tiles */
.tiles{display:grid;gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:20px;padding:14px 16px}
.tile .nm{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;color:var(--c);line-height:1}
.tile .st{font-size:14px;color:var(--muted)}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:10px 12px}
.blush .item{background:#fff}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .tx{opacity:.7}
.check{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;color:var(--accent-ink);font-weight:700}
.check[aria-pressed="true"]{background:var(--accent)}
.iconbtn{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:50%;flex:none;font-size:18px}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.blush .iconbtn:hover{background:rgba(0,0,0,.06)}
form.add{display:flex;gap:8px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;font:inherit;color:inherit;background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.blush input[type=text],.blush input[type=number],.blush select,.blush textarea{background:#fff;border-color:rgba(0,0,0,.12);color:var(--blush-ink)}
.blush .btn{background:var(--blush-ink);color:#fff}
.blush .btn.ghost{background:transparent;color:var(--blush-ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.blush input::placeholder,.blush textarea::placeholder{color:var(--blush-muted)}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.blush .tag{color:var(--blush-muted)}
.empty{text-align:center;padding:14px;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:16px}
.blush .empty{color:var(--blush-muted);border-color:rgba(0,0,0,.15)}

/* challenge */
.challenge{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));color:#1a1200;border:0}
.challenge .hint{color:rgba(26,18,0,.7)}
.challenge .btn{background:#1a1200;color:#fff}
.challenge .btn.ghost{background:transparent;color:#1a1200}
.challenge .big{font-size:22px;font-weight:700;line-height:1.25}
.donebadge{font-weight:700}

/* library placeholders */
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vid{aspect-ratio:16/10;border-radius:16px;background:var(--card2);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px;font-size:14px}
.vid .play{font-size:22px;color:var(--accent)}

/* mood */
.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mood{background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.mood .e{font-size:26px}
.mood[aria-pressed="true"]{border-color:var(--accent);background:rgba(138,223,226,.12)}

/* breathing */
.breath{align-items:center;text-align:center}
.orb{position:relative;width:min(240px,70vw);aspect-ratio:1;display:grid;place-items:center}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line)}
.orb .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(138,223,226,.9),rgba(138,223,226,.25) 65%,rgba(138,223,226,.05));box-shadow:0 0 50px 4px rgba(138,223,226,.3);transform:scale(.55);transition:transform .12s linear}
.orb .lbl{position:relative;display:flex;flex-direction:column;align-items:center;color:#04201f}
.orb .ph{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.05em}
.orb .sc{font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}
.bar{width:100%;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s linear}

/* journey */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.stat span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;color:var(--text);min-width:0}
.wd .bub{width:100%;aspect-ratio:.82;border-radius:16px 16px 20px 20px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.18);line-height:1}
.wd.on .bub{border:1.5px solid var(--c);background:var(--card2);box-shadow:0 3px 0 var(--c),0 0 16px -4px var(--c);transform:rotate(-3deg)}
.wd.on:nth-child(even) .bub{transform:rotate(3deg)}
.wd.rest .bub{font-size:16px;opacity:.55}
.wd.fut .bub{opacity:.35;border-style:dotted;font-size:14px}
.wd.today{color:var(--text)}
.wd.today .bub{outline:2px solid var(--text);outline-offset:2px}
.wd small{font-size:10px;font-weight:600;opacity:.7;height:12px}
.bal{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12)}
.donut>div{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.donut b{font-family:var(--display);font-size:34px}
.donut span{font-size:11px;color:var(--muted)}
.bleg{flex:1;min-width:150px;display:grid;gap:10px}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px}
.btrack{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.btrack i{display:block;height:100%;border-radius:99px;background:var(--c)}
.seg2{display:flex;gap:8px;margin:0 0 12px}
.wkbars{display:grid;gap:8px}
.wkrow{display:grid;grid-template-columns:92px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.wkl{display:flex;flex-direction:column;line-height:1.15;color:var(--text)}
.wkl small{font-size:10px;color:var(--play);font-weight:700}
.wktrack{display:flex;height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.wktrack i{display:block;height:100%}
.wkrow b{text-align:right}
.ms{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card2)}
.ms .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line);font-size:16px}
.ms.got .dot{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.ms.got b{color:var(--text)}
.ms:not(.got){opacity:.75}
.soon{border:1.5px dashed var(--accent);background:transparent}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--card2);padding:4px;border-radius:999px}
.seg button{background:none;border:0;border-radius:999px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details.acc{background:var(--card2);border-radius:16px}
.blush details.acc{background:#fff}
details.acc summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.blush details.acc summary::after{color:var(--blush-ink)}
details.acc[open] summary::after{content:"\2212"}
details.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:8px 14px;font-weight:500;color:inherit;min-height:40px}
.chip[aria-pressed="true"]{background:var(--blush-ink);border-color:var(--blush-ink);color:#fff;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.blush .fld{color:var(--blush-muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--blush-ink)}
.sug{background:var(--blush);color:var(--blush-ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--accent)}
.sug input[type=text]{background:#fff;color:var(--blush-ink);border-color:rgba(0,0,0,.12)}
.sug .btn{background:var(--blush-ink);color:#fff}
.sug .btn.ghost{background:transparent;color:var(--blush-ink)}
.macro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mt b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mt span{font-size:13px;color:var(--muted)}
.mt .bar{background:rgba(255,255,255,.12)}
.res{display:flex;flex-direction:column;gap:10px}
.rescard{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--blush);color:var(--blush-ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:15px}
.rescard .mt b{color:var(--blush-ink)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 .stat{padding:12px}
.statbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.statbtn[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:1px}
.stats3 .stat b{font-size:38px}
.stats3 .stat span{font-size:12px}
.hcbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:24px;padding:18px;background:linear-gradient(135deg,#ff4fa3,#ffb3c7);color:#2a0516;box-shadow:0 0 28px -8px #ff4fa3}
.hcbtn .hint{color:rgba(42,5,22,.78)}
.wk{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border-radius:16px;padding:10px}
.wkthumb{width:92px;flex:none;aspect-ratio:16/10;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:var(--muted);padding:4px}
.wk .grow p{margin:2px 0}
.card:not(.blush) .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:420px){.wkthumb{width:76px}}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,rgba(10,8,12,.92) 30%)}
nav .bar5{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:#1b171f;border:1px solid var(--line);border-radius:26px;padding:6px}
nav button{background:none;border:0;border-radius:20px;padding:8px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--script);font-size:12.5px;line-height:1.1;font-weight:400;letter-spacing:0;color:var(--nc);min-width:0;white-space:nowrap}
nav button .nem{font-size:21px;line-height:24px;height:24px;display:block;filter:saturate(.9)}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{background:var(--nc);color:#1a1200}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--blush);color:var(--blush-ink);border-radius:999px;padding:10px 12px 10px 18px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast[hidden]{display:none!important}
#toast{pointer-events:none}
#toast button{pointer-events:auto}
#toast button{background:var(--blush-ink);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-weight:700}
.fine{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px}
@media (min-width:520px){.choices,.tiles{grid-template-columns:1fr}.lib{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* WORK section: smaller type, calm and easy on the eyes */
body[data-view="work"] main,body[data-view="work"] #app{font-size:14.5px}
body[data-view="work"] .card{font-size:14px;gap:10px;padding:16px;border:1px solid var(--line);background:var(--card);box-shadow:none}
body[data-view="work"] .card h2{font-size:19px;letter-spacing:.02em;color:var(--text)}
body[data-view="work"] .card h3{font-size:15px}
body[data-view="work"] .hint{font-size:12.5px}
body[data-view="work"] .tag{font-size:10.5px;color:var(--muted)}
body[data-view="work"] .item,body[data-view="work"] details.acc,body[data-view="work"] .mt,body[data-view="work"] .wk{background:var(--card2);border:0;border-radius:16px}
body[data-view="work"] details.acc summary{padding:12px 14px;font-size:14px}
body[data-view="work"] details.acc .body{font-size:13.5px;padding:0 14px 14px}
body[data-view="work"] .btn{font-size:14px;padding:10px 18px;min-height:42px;box-shadow:none}
body[data-view="work"] .btn.small{font-size:13px;min-height:34px;padding:7px 13px}
body[data-view="work"] .chip{font-size:13px;padding:6px 12px;min-height:34px;border-color:var(--line);color:var(--text)}
body[data-view="work"] .seg{background:var(--card2)}
body[data-view="work"] .seg button{font-size:13px;padding:8px 4px}
body[data-view="work"] input[type=text],body[data-view="work"] input[type=number],body[data-view="work"] select{font-size:14.5px;padding:10px 13px;border-radius:16px}
body[data-view="work"] .choice{padding:14px 16px;border:1px solid var(--line);border-radius:20px;box-shadow:none;background:var(--card)}
body[data-view="work"] .choice:hover{box-shadow:none;transform:none;background:var(--card2)}
body[data-view="work"] .choice .nm{font-size:17px;color:var(--text)}
body[data-view="work"] .choice .ds{font-size:13px;color:var(--muted)}
body[data-view="work"] .rescard{background:var(--card2);color:var(--text);border:0;--blush-ink:var(--text);--blush-muted:var(--muted);font-size:14px}
body[data-view="work"] .rescard .kv{border-bottom-color:var(--line);font-size:14px}
body[data-view="work"] .rescard .mt{background:var(--card)!important}
body[data-view="work"] .rescard .mt b{color:var(--text)}
body[data-view="work"] .rescard .btn{background:var(--work);color:#1a1200}
body[data-view="work"] .rescard .btn.ghost{background:transparent;color:var(--text)}
body[data-view="work"] .rescard input[type=number]{background:var(--card);color:var(--text);border-color:var(--line)}
body[data-view="work"] .mt b{font-size:24px;color:var(--text)}
body[data-view="work"] .res h3{color:var(--text)}

/* ZEN: calmer, easier-to-read bubbles */
body[data-view="zen"] .card{background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5}
body[data-view="zen"] .card.blush{background:var(--card);color:var(--text);border-color:var(--line);--blush-ink:var(--text);--blush-muted:var(--muted)}
body[data-view="zen"] .card.blush .item,body[data-view="zen"] .card.blush details.acc{background:var(--card2)}
body[data-view="zen"] .card.blush input[type=text],body[data-view="zen"] .card.blush input[type=number],body[data-view="zen"] .card.blush select,body[data-view="zen"] .card.blush textarea{background:var(--card2);color:var(--text);border-color:var(--line)}
body[data-view="zen"] .card.blush .btn{background:var(--accent);color:var(--accent-ink)}
body[data-view="zen"] .card.blush .btn.ghost{background:transparent;color:var(--text)}
html:has(body[data-view="zen"]){background:#e2f4f6}
html:has(body[data-zm="night"]){background:#141116}
body[data-view="zen"] .card{box-shadow:0 4px 18px rgba(42,159,168,.10)}
body[data-view="zen"] .card.blush .tag,body[data-view="zen"] .card.blush .hint{color:var(--muted)}
body[data-view="zen"] .card.blush .chip{color:var(--text);border-color:var(--line)}
body[data-view="zen"] .hint{font-size:14px;color:var(--muted);line-height:1.5}
body[data-view="zen"] .card h2{font-size:24px}
body[data-view="zen"] .card h3{font-size:17px;line-height:1.35}
body[data-view="zen"] .choice{padding:18px;border-radius:22px;background:var(--card);border:1.5px solid var(--c)}
body[data-view="zen"] .choice .nm{font-size:24px;color:var(--text)}
body[data-view="zen"] .choice .ds{font-size:15px;color:var(--muted)}
body[data-view="zen"] .choice .em{font-size:34px}
.sechead h1.pn{font-family:var(--script);font-weight:400;text-transform:none;font-size:56px;line-height:1;letter-spacing:0}
.choice .nm.pnm{font-family:var(--script);font-weight:400;text-transform:none;font-size:30px;letter-spacing:0;line-height:1.05}
body[data-view="zen"] .sechead h1{background:linear-gradient(90deg,#4fcad1,#2a9fa8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent!important}
body[data-view="zen"] .btn:not(.ghost){background:linear-gradient(135deg,#8adfe2,#cfeeff);color:#0c1f2a}
body[data-view="zen"] .card.blush .btn:not(.ghost){background:linear-gradient(135deg,#8adfe2,#cfeeff);color:#0c1f2a}
body[data-view="zen"] .choice{border-color:rgba(138,223,226,.55);box-shadow:0 0 0 1px rgba(138,223,226,.18) inset}
body[data-view="zen"] .chip[aria-pressed="true"]{background:linear-gradient(135deg,#8adfe2,#cfeeff);color:#0c1f2a;border-color:transparent}
body[data-view="home"]{background-color:#140f1f;background-image:radial-gradient(70% 28% at 12% 4%,rgba(255,196,64,.22) 0%,transparent 70%),radial-gradient(70% 30% at 88% 14%,rgba(255,79,163,.22) 0%,transparent 70%),radial-gradient(90% 32% at 50% 100%,rgba(138,223,226,.16) 0%,transparent 70%),linear-gradient(180deg,#5a2f8f 0%,#3a2166 22%,#1d1433 55%,#140f1f 100%);background-repeat:no-repeat}
body[data-view="work"] .sechead h1,body[data-view="play"] .sechead h1,body[data-view="zen"] .sechead h1{font-size:48px}
body[data-view="work"] .sechead p,body[data-view="play"] .sechead p,body[data-view="zen"] .sechead p{font-size:13px}
body[data-view="work"] #app>*:not(.sechead),body[data-view="play"] #app>*:not(.sechead),body[data-view="zen"] #app>*:not(.sechead){zoom:.94}
body[data-view="work"] #app input,body[data-view="work"] #app select,body[data-view="work"] #app textarea,body[data-view="play"] #app input,body[data-view="play"] #app select,body[data-view="play"] #app textarea,body[data-view="zen"] #app input,body[data-view="zen"] #app select,body[data-view="zen"] #app textarea{font-size:17px}

body[data-view="zen"][data-zm="night"]{--accent:#8adfe2;--accent-ink:#0c1f2a;--ink:#141116;--card:#1f1b23;--card2:#2a2530;--line:rgba(255,255,255,.12);--text:#f7eff2;--muted:#bdb2bb;--blush:#1f1b23;--blush-ink:#f7eff2;--blush-muted:#bdb2bb;color-scheme:dark;background:#141116}
body[data-view="zen"][data-zm="night"] .card{box-shadow:none}
body[data-view="zen"][data-zm="night"] .sechead h1{background:linear-gradient(90deg,#8adfe2,#e3f6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.zmrow{display:flex;gap:8px;justify-content:flex-end}

.subbtn{background:none;border:0;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border-radius:50%;opacity:.8}
.subbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.subbtn:hover{opacity:1}
.dmrow{display:flex;justify-content:space-between;align-items:center}
.dmsw{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:15px;line-height:1;color:var(--text);min-height:34px}
.dmsw i{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;display:block}
.dmsw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .25s}
.dmsw[aria-checked="false"] i::after{transform:translateX(16px)}
body[data-zm="day"] .dmsw i{background:rgba(0,0,0,.14)}
body[data-zm="day"] nav{background:linear-gradient(180deg,transparent,rgba(255,255,255,.75) 35%)}
body[data-view="home"][data-zm="day"]{--accent:#e0207f;--accent-ink:#fff;--ink:#fff4f8;--card:#ffffff;--card2:#fde6ef;--line:rgba(140,60,100,.2);--text:#2b1a24;--muted:#7a5d6b;--blush:#fff0f5;--blush-ink:#2b1a24;--blush-muted:#7a5d6b;color-scheme:light;background-color:#fff4f8;background-image:radial-gradient(70% 28% at 12% 4%,rgba(255,224,71,.35) 0%,transparent 70%),radial-gradient(70% 30% at 88% 14%,rgba(255,79,163,.22) 0%,transparent 70%),radial-gradient(90% 32% at 50% 100%,rgba(138,223,226,.3) 0%,transparent 70%),linear-gradient(180deg,#f3e6ff 0%,#fff0f6 40%,#fff9fb 100%)}
body[data-view="work"][data-zm="day"]{--accent:#c99700;--accent-ink:#241a00;--ink:#fff8d8;--card:#fffdf0;--card2:#fff0a8;--line:rgba(150,110,0,.25);--text:#2a2200;--muted:#7a6a2a;--blush:#fffdf0;--blush-ink:#2a2200;--blush-muted:#7a6a2a;color-scheme:light;background:linear-gradient(180deg,#ffef9a 0%,#fff6c4 45%,#fffbe6 100%) fixed}
body[data-view="play"][data-zm="day"]{--accent:#e0207f;--accent-ink:#fff;--ink:#ffeef6;--card:#ffffff;--card2:#ffe0ee;--line:rgba(200,40,120,.22);--text:#2b1020;--muted:#7a4a62;--blush:#fff0f6;--blush-ink:#2b1020;--blush-muted:#7a4a62;color-scheme:light;background:linear-gradient(180deg,#ffd3e6 0%,#ffe6f1 45%,#fff5f9 100%) fixed}
body[data-view="healthcode"][data-zm="day"],body[data-view="journey"][data-zm="day"]{--accent:#d9487f;--accent-ink:#fff;--ink:#fff0f4;--card:#ffffff;--card2:#ffe3ec;--line:rgba(200,80,120,.22);--text:#2b1a24;--muted:#7a5d6b;--blush:#fff0f4;--blush-ink:#2b1a24;--blush-muted:#7a5d6b;color-scheme:light;background:linear-gradient(180deg,#ffd9e5 0%,#ffeaf0 45%,#fff7f9 100%) fixed}
body[data-view="work"][data-zm="day"] .btn:not(.ghost),body[data-view="work"][data-zm="day"] .rescard .btn{background:#ffd966;color:#3a2a00}
html:has(body[data-zm="day"][data-view="home"]){background:#fff4f8}
html:has(body[data-zm="day"][data-view="work"]){background:#fff6c4}
html:has(body[data-zm="day"][data-view="play"]){background:#ffe6f1}
html:has(body[data-zm="day"][data-view="healthcode"]){background:#ffeaf0}
body[data-view="work"][data-zm="day"] .sechead h1{color:#000!important}
body[data-view="healthcode"][data-zm="day"] .sechead h1{color:#d9487f!important}
body[data-zm="day"] [style*="color:var(--work)"],body[data-zm="day"] [style*="color:#ffe047"]{color:#a87c00!important}

.wkrow{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:stretch}

  S.hc.items.push({id:uid(),key:o.key,text:text||o.label,src:"joy",note:"Felt "+nat(o.tags),ts:Date.now()});
  var di=S.hc.dismissed.indexOf(o.key);if(di>=0)S.hc.dismissed.splice(di,1);
  session.hcOffer=null;save();toast("Added to your Health Code 🔑");render();
}
function expCard(){
  if(!S.experiences.length)return "";
  var h='<div class="card"><h2>Play experiences</h2><ul class="list">';
  S.experiences.slice(-5).reverse().forEach(function(e){
    h+='<li class="item" style="align-items:flex-start"><span class="tx"><span class="tag">'+fmt(e.ts)+" · "+esc(CATS[e.cat]||"Play")+'</span><br><b>'+esc(e.title)+'</b>'+(e.feelings&&e.feelings.length?'<br><span class="hint">Felt: '+esc(e.feelings.join(", "))+'</span>':"")+(e.tags&&e.tags.length?'<br><span class="hint">Felt '+esc(nat(e.tags))+'</span>':"")+(e.discovered?'<br><span class="hint">Discovered: '+esc(e.discovered)+'</span>':"")+(e.written?'<br><span class="hint">'+esc(e.written)+'</span>':"")+'</span><button type="button" class="iconbtn" aria-label="Delete '+esc(e.title)+'" data-act="delexp" data-id="'+e.id+'">✕</button></li>';
  });
  return h+'</ul></div>';

function act3(a,d){
  switch(a){
  case "surprise":
    var ns=pickSur();session.surMsg="";session.surReflect=null;clearSurDrafts();
    if(!ns){session.sur="";session.surMsg="You've set aside every idea I have. You can reset your suggestion preferences below to see them again."}
    else setSur(ns);
    render();return;
  case "sur_save":
    var ss=curSur();if(!ss)return;
    if(S.joy.some(function(x){return norm(x.text)===norm(ss.t)})){toast("Already on your Fun List");return}
    S.joy.push({id:uid(),text:ss.t,n:0});S.plr.pos[ss.cat]=(S.plr.pos[ss.cat]||0)+1;save();
    session.surMsg="Saved to your Fun List. It will be there whenever you want it.";render();return;
  case "sur_tried":
    var st=curSur();if(!st||(session.surReflect&&session.surReflect.sid===st.id))return;
    var ex={id:uid(),ts:Date.now(),date:today(),sid:st.id,title:st.t,cat:st.cat,feelings:[],written:"",discovered:"",tags:[]};
    S.experiences.push(ex);logAct(st.t,"play");clearSurDrafts();
    session.surMsg="";session.surReflect={sid:st.id,eid:ex.id,feelings:[],tags:[]};
    toast(cheer("play")+" It's saved to your balance tracker.");render();return;
  case "sur_no":
    var sn=curSur();if(!sn)return;
    if(S.plr.skip.indexOf(sn.id)<0)S.plr.skip.push(sn.id);
    S.plr.neg[sn.cat]=(S.plr.neg[sn.cat]||0)+1;save();
    session.surReflect=null;clearSurDrafts();
    var nn=pickSur();
    if(nn){setSur(nn);session.surMsg="Totally fine. Not every idea fits, and that's useful to know. Here's something different."}
    else{session.sur="";session.surMsg="Totally fine. I've set aside all my ideas, so you can reset your preferences below whenever you like."}
    render();return;
  case "sfeel":var f1=session.surReflect.feelings,fi=f1.indexOf(d.f);if(fi>=0)f1.splice(fi,1);else f1.push(d.f);render();return;
  case "stag":var t1=session.surReflect.tags,ti=t1.indexOf(d.t);if(ti>=0)t1.splice(ti,1);else t1.push(d.t);render();return;
  case "sursave":
    var rf=session.surReflect;if(!rf)return;
    var feelings=rf.feelings.map(function(f){return f==="Something else"?(drafts.sother||"").trim():f}).filter(Boolean);
    var written=(drafts.swritten||"").trim(),disc=(drafts.sdisc||"").trim();
    if(!feelings.length&&!written&&!disc&&!rf.tags.length){toast("Add a feeling or a few words, or skip");return}
    var exp=null;S.experiences.forEach(function(e){if(e.id===rf.eid)exp=e});
    if(exp){exp.feelings=feelings;exp.written=written;exp.discovered=disc;exp.tags=rf.tags.slice();
      if(rf.tags.length){S.plr.pos[exp.cat]=(S.plr.pos[exp.cat]||0)+2;var key="joy:"+norm(exp.title);if(!hcHas(key))session.hcOffer={key:key,label:exp.title,tags:rf.tags.slice(),edit:false}}}
    session.surReflect=null;clearSurDrafts();save();toast(cheer("write"));render();return;
  case "surskip":session.surReflect=null;clearSurDrafts();toast("No problem. Your experience is still saved.");render();return;
  case "offyes":addOffer();return;
  case "offedit":session.hcOffer.edit=true;drafts.offtext=session.hcOffer.label;render();return;
  case "offcancel":session.hcOffer.edit=false;render();return;
  case "offsave":addOffer((drafts.offtext||"").trim());return;
  case "offno":session.hcOffer=null;toast("Okay. Nothing was added.");render();return;
  case "plrreset1":session.confirmPlr=true;render();return;
  case "plrreset0":session.confirmPlr=false;render();return;
  case "plrreset2":S.plr={skip:[],pos:{},neg:{}};session.confirmPlr=false;session.seen=[];save();toast("Suggestion preferences reset");render();return;
  case "delexp":removeFrom(S.experiences,d.id,"Experience");return;
  default:act4(a,d);
  }
}

var GVERBS="dance take go walk paint hold drink read stretch practice move try call listen journal write cook bake sing draw play meditate breathe stay spend get do make watch visit hug text light sit lift run swim hike bike ride cuddle nap rest sleep eat enjoy have spend sip soak take pray garden plant bathe shower dress shop explore create build learn study sketch color knit sew craft host invite meet chat laugh smile love give share thank journal reflect plan organize clean tidy declutter wake rise start finish unplug disconnect step sunbathe stargaze camp climb jump skip hop jog row ski skate surf paddle kayak fish dive snuggle slow pause connect reach join try open close put set sweat pet feed cheer celebrate wander roam travel drive fly sail bike lounge relax unwind restore recharge refuel hydrate fuel prep stand push pull squat lunge dip kick bring light burn diffuse apply wear use choose pick say ask tell speak sing hum whistle".split(" ");
var GDBL="run sit get swim plan hop stop chat cut put hit jog skip sip hug nap pet set dip shop wrap clap tap pin knit".split(" ");
function ing(text){
  var m=String(text).match(/^(\s*)([A-Za-z]+)([\s\S]*)$/);if(!m)return text;
  var w=m[2],lw=w.toLowerCase();
  if(/ing$/.test(lw)||GVERBS.indexOf(lw)<0)return text;
  var r;
  if(lw==="be")r="being";
  else if(GDBL.indexOf(lw)>=0)r=lw+lw.charAt(lw.length-1)+"ing";
  else if(/ie$/.test(lw))r=lw.slice(0,-2)+"ying";
  else if(/[^aeiouy]e$/.test(lw)&&!/(ee|ye|oe)$/.test(lw))r=lw.slice(0,-1)+"ing";
  else r=lw+"ing";
  return m[1]+r.charAt(0).toUpperCase()+r.slice(1)+m[3];
}

function tickBreath(){
  B.t+=0.1;var total=TOT;
  if(B.t>=total){stopBreath();B.done=true;S.breaths.push({ts:Date.now(),date:today()});save();logAct("Guided breathing","zen");session.rate={key:"zen:breathing",label:"Guided breathing"};session.bw=true;drafts.bw="";render();toast(cheer("calm"));return}
  var c=0,ph=B.t;while(c<CYC-1&&ph>=SCH[c][0]+SCH[c][1]){ph-=SCH[c][0]+SCH[c][1];c++}
  var IN=SCH[c][0],OUT=SCH[c][1],LEN=IN+OUT,inh=ph<IN,left,sc;
  if(inh){left=IN-ph;sc=.55+.45*(ph/IN)}else{left=LEN-ph;sc=1-.45*((ph-IN)/OUT)}
  var g=document.getElementById("bGlow");if(!g){return}
  g.style.transform="scale("+sc.toFixed(3)+")";
  document.getElementById("bPh").textContent=inh?"Breathe in":"Breathe out";
  document.getElementById("bSc").textContent=Math.ceil(left);
  document.getElementById("bCt").textContent="Round "+(c+1)+" of "+CYC;
  document.getElementById("bBar").style.width=(B.t/total*100)+"%";
}

  case "applesave":var au=(drafts.apple_url||"").trim();if(!appleOk(au)){session.appleErr="That doesn\'t look like an Apple Music link. It should start with https://music.apple.com/";render();return}S.applePl=au;drafts.apple_url="";session.appleErr="";save();toast("Playlist saved");render();return;
  case "appleclear":drafts.apple_url=S.applePl||"";S.applePl="";session.appleErr="";save();render();return;
  case "wkv":session.wkv=d.v||"";if(d.v==="workouts")session.wl={v:"home"};if(d.v==="macros")session.fuel="track";if(d.v==="now"&&!(S.checkin&&S.checkin.date===today()&&S.checkin.p==="work")){S.checkin={date:today(),p:"work",i:rnd(CHECK.work.length),tried:false,declined:false};save()}window.scrollTo(0,0);render();return;
  case "undotry":var c3=S.checkin;if(!c3||!c3.tried)return;var uk="try:"+today()+":"+curIdea(c3).a;S.activities=S.activities.filter(function(a){return a.key!==uk});S.checkins=S.checkins.filter(function(x){return x.ts!==c3.cts});c3.tried=false;c3.cts=0;if(session.reflect&&session.reflect.src==="home")session.reflect=null;save();toast("Undone. No problem.");render();return;
  case "notnow":S.checkin.declined=true;save();render();return;
  case "recheck":session.recheck=true;render();window.scrollTo(0,0);return;
  case "habit":var t=today(),ex=-1;S.habitLog.forEach(function(l,i){if(l.id===d.id&&l.date===t)ex=i});
    if(ex>=0)S.habitLog.splice(ex,1);else{S.habitLog.push({id:d.id,ts:Date.now(),date:t});toast(cheer("habit"))}
    save();render();return;
  case "delhabit":removeFrom(S.habits,d.id,"Habit");return;
  case "wchall":S.weekDone["work-"+weekKey()]=!S.weekDone["work-"+weekKey()];if(S.weekDone["work-"+weekKey()]){logAct("Weekly WORK challenge","work","wc:"+weekKey())}else{S.activities=S.activities.filter(function(a){return a.key!=="wc:"+weekKey()})}save();render();return;
  case "pchall":S.weekDone["play-"+weekKey()]=!S.weekDone["play-"+weekKey()];if(S.weekDone["play-"+weekKey()]){var pct=PLAYCH[(weekNum()+(S.playOffset[weekKey()]||0))%PLAYCH.length];logAct(pct,"play","pc:"+weekKey());session.reflect={text:pct,joyId:null,fromTap:false,feeling:"",src:"challenge"}}else{S.activities=S.activities.filter(function(a){return a.key!=="pc:"+weekKey()})}save();render();return;
  case "pswap":var k=weekKey();S.playOffset[k]=(S.playOffset[k]||0)+1;save();render();return;
  
  
  
  case "joyenjoy":S.joy.forEach(function(x){if(x.id===d.id){x.n=(x.n||0)+1;logAct(x.text,"play");addSignal("joy:"+norm(x.text),x.text,"joy");if(!x.hist)x.hist=[];x.hist.push({a:S.activities[S.activities.length-1].id,s:S.signals[S.signals.length-1].id});session.reflect={text:x.text,joyId:x.id,fromTap:true,feeling:"",src:"joy"};toast(cheer("play"))}});save();render();return;
  case "tnttoggle":S.tnt.forEach(function(x){if(x.id!==d.id)return;if(!x.done){x.done=true;x.doneTs=Date.now();logAct("Tried something new: "+x.text,"play","tnt:"+x.id);session.reflect={text:x.text,joyId:null,fromTap:false,feeling:"",src:"tnt"};toast(cheer("play"))}else{x.done=false;x.doneTs=0;S.activities=S.activities.filter(function(a){return a.key!=="tnt:"+x.id});if(session.reflect&&session.reflect.src==="tnt")session.reflect=null}});save();render();return;
  case "deltnt":S.activities=S.activities.filter(function(a){return a.key!=="tnt:"+d.id});removeFrom(S.tnt,d.id,"Item");return;
  case "joyundo":S.joy.forEach(function(x){if(x.id!==d.id||!(x.n>0))return;var h=x.hist&&x.hist.length?x.hist.pop():null;if(h){S.activities=S.activities.filter(function(a){return a.id!==h.a});S.signals=S.signals.filter(function(g){return g.id!==h.s})}else{for(var i=S.activities.length-1;i>=0;i--){if(S.activities[i].text===x.text&&S.activities[i].p==="play"&&!S.activities[i].key){S.activities.splice(i,1);break}}for(var j=S.signals.length-1;j>=0;j--){if(S.signals[j].key==="joy:"+norm(x.text)){S.signals.splice(j,1);break}}}x.n--;if(session.reflect&&session.reflect.joyId===x.id&&session.reflect.fromTap)session.reflect=null});save();toast("Undone. No problem.");render();return;
  case "peaceenjoy":S.peace.forEach(function(x){if(x.id===d.id){x.n=(x.n||0)+1;logAct(x.text,"zen");if(!x.hist)x.hist=[];x.hist.push(S.activities[S.activities.length-1].id);toast(cheer("calm"))}});save();render();return;
  case "peaceundo":S.peace.forEach(function(x){if(x.id!==d.id||!(x.n>0))return;var id=x.hist&&x.hist.length?x.hist.pop():null;if(id){S.activities=S.activities.filter(function(a){return a.id!==id})}else{for(var i=S.activities.length-1;i>=0;i--){if(S.activities[i].text===x.text&&S.activities[i].p==="zen"&&!S.activities[i].key){S.activities.splice(i,1);break}}}x.n--});save();toast("Undone. No problem.");render();return;
  case "delpeace":removeFrom(S.peace,d.id,"Peace item");return;
  case "deljoy":removeFrom(S.joy,d.id,"Joy item");return;
  case "mood":session.mood=d.m;session.support="";session.mf=null;render();return;
  case "savemood":if(!session.mood)return;var already=S.moodLog.some(function(e){return e.date===today()&&e.mood===session.mood});if(!already)S.moodLog.push({id:uid(),ts:Date.now(),date:today(),mood:session.mood});save();toast("Check-in saved");render();return;
  case "bstart":stopBreath();B.t=0;B.done=false;B.running=true;session.bw=false;render();B.timer=setInterval(tickBreath,100);return;
  case "bstop":stopBreath();B.t=0;render();return;
  case "savegrat":var gi=[];for(var gx=1;gx<=5;gx++){var gt=(drafts["g"+gx]||"").trim();if(gt)gi.push(gx+". "+gt)}var sm=(drafts.smile||"").trim();if(!gi.length&&!sm){toast("Write a little first");return}var grp=uid();if(gi.length)S.journal.push({id:uid(),grp:grp,ts:Date.now(),date:today(),kind:"gratitude",text:gi.join("\n")});if(sm)S.journal.push({id:uid(),grp:grp,ts:Date.now()+1,date:today(),kind:"smile",text:sm});for(var gy=1;gy<=5;gy++)drafts["g"+gy]="";drafts.smile="";save();toast(cheer("write"));render();return;
  case "saverefl":var rv=(drafts.refl||"").trim();if(!rv){toast("Write a little first");return}S.reflections.push({id:uid(),ts:Date.now(),date:today(),text:rv});drafts.refl="";save();toast(cheer("write"));render();return;
  case "savejrn":var jv=(drafts.jrn||"").trim();if(!jv){toast("Write a little first");return}S.journal.push({id:uid(),ts:Date.now(),date:today(),kind:"entry",text:jv});drafts.jrn="";session.rate={key:"zen:journaling",label:"Journaling"};save();toast(cheer("write"));render();return;
  case "editjrn":S.journal.forEach(function(e){if(e.id===d.id)drafts.edit=e.text});session.editing=d.id;render();return;
  case "canceledit":session.editing=null;render();return;
  case "saveedit":var ev=(drafts.edit||"").trim();if(!ev){toast("An entry needs some words");return}S.journal.forEach(function(e){if(e.id===d.id)e.text=ev});session.editing=null;save();toast("Changes saved");render();return;
  case "deljrn":removeFrom(S.journal,d.id,"Entry");return;
  case "reset1":session.confirmReset=true;render();return;
  case "reset0":session.confirmReset=false;render();return;
  case "reset2":session.confirmReset=false;S=defaults();S.lastVisit=today();save();drafts={};session.welcomeBack=false;session.mood="";session.reflect=null;session.rate=null;session.calcRes=null;session.sur="";session.surMsg="";session.surReflect=null;session.hcOffer=null;render();toast("Fresh start");return;
  case "delrefl":removeFrom(S.joyReflections,d.id,"Reflection");return;
  default:act2(a,d);
  }
}
function submit(a){
  if(submit2(a))return;
  if(a==="savename"){S.name=(drafts.name||"").trim();session.editName=false;save();render();return}
  if(a==="addhabit"){var v=(drafts.habit||"").trim();if(!v)return;S.habits.push({id:uid(),name:v});drafts.habit="";save();render();var i=document.getElementById("habitIn");if(i)i.focus();return}
  if(a==="addown"){var ot=(drafts.own||"").trim();if(!ot){toast("Write what you did first");return}if(!session.ownp){toast("Pick WORK, PLAY or ZEN");return}var ok="own:"+uid();logAct(ot,session.ownp,ok);drafts.own="";toast("Added to your balance tracker",function(){S.activities=S.activities.filter(function(x){return x.key!==ok});save()});render();return}
  if(a.indexOf("addgl_")===0){var gk=a.slice(6),gt=(drafts["gl_"+gk]||"").trim();if(!gt)return;S.gl.push({id:uid(),ts:Date.now(),date:today(),kind:gk,text:gt});drafts["gl_"+gk]="";save();toast(cheer("write"));render();var gq=document.getElementById("gl_"+gk);if(gq)gq.focus();return}
  if(a==="addtnt"){var tn=(drafts.tnt||"").trim();if(!tn)return;S.tnt.push({id:uid(),text:tn,done:false,ts:Date.now()});drafts.tnt="";save();render();var tq=document.getElementById("tntIn");if(tq)tq.focus();return}
  if(a==="addpeace"){var pj=(drafts.peace||"").trim();if(!pj)return;S.peace.push({id:uid(),text:pj,n:0});drafts.peace="";save();render();var pq=document.getElementById("peaceIn");if(pq)pq.focus();return}
  if(a==="addjoy"){var j=(drafts.joy||"").trim();if(!j)return;S.joy.push({id:uid(),text:j,n:0});drafts.joy="";save();render();var q=document.getElementById("joyIn");if(q)q.focus();return}
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset)});
document.addEventListener("input",function(e){var dk=e.target.dataset&&e.target.dataset.draft;if(!dk)return;drafts[dk]=e.target.type==="checkbox"?e.target.checked:e.target.value;if(dk==="c_units"||dk.indexOf("w_")===0)render()});
document.addEventListener("submit",function(e){e.preventDefault();var s=e.target.dataset.submit;if(s)submit(s)});
function fromHash(){var h="";try{h=location.hash.replace("#","")}catch(x){}return ["work","play","zen","healthcode","myyear"].indexOf(h)>=0?h:"home"}
window.addEventListener("hashchange",function(){var v=fromHash();if(v!==view){stopBreath();if(v==="work")session.wkv="";if(v==="zen")session.znv="";view=v;render()}});
view=fromHash();render();
})();
</script>
